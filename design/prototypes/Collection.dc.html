<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700&family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
body{margin:0;background:#FFFFFF;color:#262626;font-family:'Manrope',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:#DAFF2B;color:#262626}
a{color:inherit;text-decoration:none;transition:opacity .3s}
a:hover{color:inherit;opacity:.55}
</style>
</helmet>

<header style="position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:22px 4vw;color:#262626;background:linear-gradient(to bottom,rgba(255,255,255,.92),rgba(255,255,255,0))">
  <a href="Home.dc.html" style="display:flex;align-items:baseline;gap:10px">
    <svg viewBox="0 0 51.26 9.96" style="width:96px;fill:currentColor;display:block"><path d="M4,0h2.78s4,9.96,4,9.96h-2.68s-.64-1.76-.64-1.76H3.3s-.64,1.76-.64,1.76H0S4,0,4,0ZM6.72,6.18l-1.32-3.67-1.35,3.67h2.68Z"></path><path d="M12.58,0h3.42c3.69,0,5.12,2.23,5.12,4.98,0,2.75-1.44,4.98-5.12,4.98h-3.42s0-9.96,0-9.96ZM15.87,7.81c1.82,0,2.69-1.24,2.69-2.83,0-1.59-.87-2.83-2.69-2.83h-.81v5.66h.81Z"></path><path d="M23.34,0h3.42c3.69,0,5.12,2.23,5.12,4.98s-1.44,4.98-5.12,4.98h-3.42s0-9.96,0-9.96ZM26.62,7.81c1.82,0,2.69-1.24,2.69-2.83,0-1.59-.87-2.83-2.69-2.83h-.81v5.66h.81Z"></path><path d="M40.5,0h-6.4v2.15h3.93s0,1.68,0,1.68h-3.37s.39,2.15.39,2.15h2.98s0,1.84,0,1.84h-3.93v2.15h6.4V0Z"></path><path d="M42.72,0h3.42c3.69,0,5.12,2.23,5.12,4.98,0,2.75-1.44,4.98-5.12,4.98h-3.42s0-9.96,0-9.96ZM46,7.81c1.82,0,2.69-1.24,2.69-2.83,0-1.59-.87-2.83-2.69-2.83h-.81v5.66h.81Z"></path></svg>
    <span style="font-size:10px;font-weight:300;letter-spacing:.34em">FORMS</span>
  </a>
  <nav style="display:flex;gap:36px;font-size:11px;font-weight:300;letter-spacing:.1em;text-transform:uppercase">
    <a href="Collection.dc.html" style="border-bottom:2px solid #DAFF2B;padding-bottom:3px">Collection</a>
    <a href="Home.dc.html#about">About</a>
    <a href="Home.dc.html#contact">Contact</a>
  </nav>
</header>

<section data-screen-label="Collection header" style="padding:20vh 4vw 0;background:#FFFFFF">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:3vh">
    <span style="width:7px;height:7px;background:#DAFF2B;display:inline-block"></span>
    <span style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(38,38,38,.55)">All objects</span>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:24px;padding-bottom:5vh;border-bottom:1px solid rgba(38,38,38,.14)">
    <h1 data-hero-mark style="margin:0;font-family:'Titillium Web',sans-serif;font-weight:600;font-size:clamp(40px,5.8vw,100px);letter-spacing:.05em;line-height:1.05;text-transform:uppercase">Collection</h1>
    <span style="font-size:12px;font-weight:300;letter-spacing:.1em;text-transform:uppercase;color:rgba(38,38,38,.5)">{{ count }} objects</span>
  </div>
  <div style="display:flex;gap:28px;flex-wrap:wrap;padding:26px 0">
    <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
      <button onClick="{{ f.pick }}" style="background:none;border:none;cursor:pointer;padding:0 0 4px;font-family:'Manrope',sans-serif;font-size:11px;font-weight:300;letter-spacing:.1em;text-transform:uppercase;color:{{ f.color }};border-bottom:2px solid {{ f.line }};transition:color .3s,border-color .3s">{{ f.label }}</button>
    </sc-for>
  </div>
</section>

<section data-screen-label="Collection grid" style="padding:4vh 4vw 16vh;background:#FFFFFF">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9vh 2vw">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
      <a href="Product.dc.html" data-grid-item style="display:block">
        <div style="overflow:hidden;aspect-ratio:4/5;background:#f1f1ee;position:relative">
          <sc-if value="{{ it.img }}" hint-placeholder-val="{{ true }}">
            <img src="{{ it.img }}" alt="{{ it.name }}" style="width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.22,1,.36,1)" style-hover="transform:scale(1.045)">
          </sc-if>
          <sc-if value="{{ it.noImg }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,#f3f3f0 0 14px,#e9e9e4 14px 28px);display:flex;align-items:center;justify-content:center">
              <span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:rgba(38,38,38,.5);text-align:center;padding:0 20px">product shot — {{ it.name }}</span>
            </div>
          </sc-if>
          <span style="position:absolute;top:14px;left:14px;font-size:10px;font-weight:300;letter-spacing:.1em;color:rgba(38,38,38,.55)">{{ it.num }}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;gap:12px">
          <span style="font-size:12px;font-weight:300;letter-spacing:.1em;text-transform:uppercase">{{ it.name }}</span>
          <span style="font-size:11px;font-weight:300;letter-spacing:.1em;text-transform:uppercase;color:rgba(38,38,38,.45);text-align:right">{{ it.material }}</span>
        </div>
        <div style="margin-top:4px;font-size:11px;font-weight:300;letter-spacing:.1em;text-transform:uppercase;color:rgba(38,38,38,.4)">{{ it.category }}</div>
      </a>
    </sc-for>
  </div>
</section>

<footer data-screen-label="Footer" style="background:#262626;color:#FFFFFF;padding:10vh 4vw 4vh">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:24px;padding-bottom:6vh;border-bottom:1px solid rgba(255,255,255,.14)">
    <h2 style="margin:0;font-family:'Titillium Web',sans-serif;font-weight:300;font-size:clamp(24px,2.6vw,44px);letter-spacing:.06em;line-height:1.25;text-transform:uppercase">Something custom in mind?</h2>
    <a href="mailto:hello@addedforms.com" style="display:inline-flex;align-items:center;gap:12px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#DAFF2B"><span style="width:7px;height:7px;background:#DAFF2B;display:inline-block"></span>Enquire — custom-made</a>
  </div>
  <div style="display:flex;justify-content:space-between;padding-top:4vh;font-size:11px;font-weight:300;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)">
    <span>© 2026 Added Forms</span>
    <a href="Home.dc.html" style="color:#FFFFFF">Back to home</a>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: 'All' };
  static DATA = [
    { name: 'Wireframe', category: 'Interior Objects', material: 'Stainless steel', img: 'uploads/Asset%202.jpg' },
    { name: 'St Table', category: 'Interior Objects', material: 'Stainless steel', img: 'uploads/Asset%205.jpg' },
    { name: 'Stools & Benches', category: 'Interior Objects', material: 'Iron · Wood', img: null },
    { name: 'Magazine Rack', category: 'Interior Objects', material: 'Iron', img: null },
    { name: 'Mirror', category: 'Interior Objects', material: 'Stainless steel', img: null },
    { name: 'UFO', category: 'Interior Objects', material: 'Aluminium', img: null },
    { name: 'Lior Comb', category: 'Personal Accessories', material: 'Stainless steel', img: 'uploads/Screenshot%201405-04-30%20at%207.41.08%20AM.png' },
    { name: 'Jooje', category: 'Personal Accessories', material: 'Aluminium', img: null },
    { name: 'Custom-Made', category: 'Personal Accessories', material: 'On request', img: null },
    { name: 'Trio Stand', category: 'Shelving & Storage', material: 'Iron', img: null },
    { name: 'Modular Shelf', category: 'Shelving & Storage', material: 'Stainless steel', img: 'uploads/Asset%201.jpg' },
    { name: 'Donut', category: 'Decorative Objects', material: 'Stainless steel', img: 'uploads/Asset%204.jpg' },
    { name: '1/4', category: 'Decorative Objects', material: 'Aluminium', img: null },
    { name: '1/8', category: 'Decorative Objects', material: 'Aluminium', img: null }
  ];
  componentDidMount() {
    this._alive = true;
    const wait = () => {
      if (!this._alive) return;
      if (window.gsap && window.ScrollTrigger) {
        window.gsap.registerPlugin(window.ScrollTrigger);
        this.initMotion();
      } else setTimeout(wait, 80);
    };
    wait();
  }
  componentWillUnmount() { this._alive = false; this.killMotion(); }
  componentDidUpdate(prevProps, prevState) {
    if (prevState && prevState.filter !== this.state.filter) {
      clearTimeout(this._re); this._re = setTimeout(() => this.initMotion(), 100);
    }
  }
  killMotion() {
    (this._tweens || []).forEach(t => {
      if (t && t.scrollTrigger) t.scrollTrigger.kill(true);
      if (t && t.kill) t.kill();
    });
    this._tweens = [];
  }
  initMotion() {
    const gsap = window.gsap, ST = window.ScrollTrigger;
    if (!gsap || !ST || !this._alive) return;
    this.killMotion();
    const T = this._tweens;
    const mark = document.querySelector('[data-hero-mark]');
    if (mark) T.push(gsap.fromTo(mark, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 1.2, ease: 'power4.out' }));
    const items = Array.from(document.querySelectorAll('[data-grid-item]'));
    items.forEach((el, i) => {
      T.push(gsap.fromTo(el, { y: 54, opacity: 0 }, { y: 0, opacity: 1, duration: 1.05, ease: 'power3.out', delay: (i % 3) * .08, immediateRender: false, scrollTrigger: { trigger: el, start: 'top 92%' } }));
    });
    ST.refresh();
  }
  renderVals() {
    const cats = ['All', 'Interior Objects', 'Personal Accessories', 'Shelving & Storage', 'Decorative Objects'];
    const f = this.state.filter;
    const list = Component.DATA.filter(d => f === 'All' || d.category === f);
    return {
      count: String(list.length).padStart(2, '0'),
      filters: cats.map(c => ({
        label: c,
        color: c === f ? '#262626' : 'rgba(38,38,38,.45)',
        line: c === f ? '#DAFF2B' : 'transparent',
        pick: () => this.setState({ filter: c })
      })),
      items: list.map((d, i) => ({
        ...d, noImg: !d.img, num: String(i + 1).padStart(2, '0')
      }))
    };
  }
}
</script>
</body>
</html>
