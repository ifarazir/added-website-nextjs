# Local PostgreSQL for development.
#   docker compose up -d
#   npm run db:migrate && npm run db:seed
services:
  postgres:
    image: postgres:16-alpine
    container_name: added-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: added
    ports:
      - "5432:5432"
    volumes:
      - added-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d added"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  added-pgdata:
