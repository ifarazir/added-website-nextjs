name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: added_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/added_ci
      AUTH_SECRET: ci-secret-not-used-anywhere-real
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Proves the schema and the seed still apply to an empty database, which
      # is the path every new deployment takes.
      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed
        env:
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-password-placeholder

      - name: Build
        run: npm run build
